# GrapeMobile 配置文件示例
# 用法: 复制为 config.yaml 并填入真实值;load_config() 默认读取项目根的 config.yaml
# 只需覆盖你关心的字段，未列出的字段会自动使用内置默认值

# ---- AI 客户端(OpenAI 兼容接口) ----
ai:
  base_url: "https://apihub.agnes-ai.com/v1"
  api_key: "sk-your-api-key-here"
  model: "agnes-3.0-flash"
  timeout: 120
  max_tokens: 2048

# ---- 定位管线 ----
locate:
  mode: full                # full | ocr_only | vlm_only
  vlm:
    provider: openai_compat
    base_url: "https://apihub.agnes-ai.com/v1"
    api_key: "sk-your-api-key-here"
    model: "agnes-3.0-flash"
    fallback_model: ""
    samples: 3
    temperature: 0.4
    coord_format: norm1000_xyxy
    max_side: 1568
    timeout: 120
  ocr:
    engine: rapidocr
    fuzzy_threshold: 0.8
    icon_search_ratio: 3.5
  verify:
    enabled: true
    crop_expand: 0.2
    min_size: 256
    top_k: 3
  fusion:
    weights:
      template: 0.5
      ocr_exact: 0.35
      ocr_fuzzy: 0.2
      vlm_consistent: 0.3
      multi_source: 0.15
  debug:
    save_images: true
    dir: runner/tmp/locate_debug

# ---- 网格 ----
grid:
  cell_size: 30

# ---- imgloc 图像匹配库(可选,仅使用 imgloc 时需要) ----

router:
  # 责任链尝试顺序，可自由增删/调整。例如不想用形状匹配和深度学习层，可写：
  # order: [template, orb, sift]
  order: [template, shape, orb, sift, lightglue]
  # 全局默认阈值（各层配置中的 threshold 优先级更高，会覆盖此项）
  default_threshold: 0.8
  # 某层异常/依赖缺失时是否静默跳过（推荐保持 true，保证责任链健壮性）
  skip_on_error: true

template:
  threshold: 0.85
  method: TM_CCOEFF_NORMED   # TM_CCOEFF_NORMED / TM_CCORR_NORMED / TM_SQDIFF_NORMED
  scale_range: [0.5, 1.5]    # 多尺度金字塔遍历范围
  scale_step: 0.05
  use_color: true            # true=RGB三通道加权匹配，false=转灰度匹配(更快)
  channel_weights: [0.34, 0.33, 0.33]
  rotation_invariant: false  # 是否开启旋转不变匹配（会显著增加耗时）
  rotation_range: [-15, 15]
  rotation_step: 5

shape:
  threshold: 0.75
  canny_low: 50
  canny_high: 150
  scale_range: [0.8, 1.2]
  scale_step: 0.1
  angle_range: [-10, 10]
  angle_step: 5

orb:
  threshold: 0.35
  n_features: 500
  matcher_type: bf           # bf / flann
  min_match_count: 8
  ransac_reproj_threshold: 5.0
  knn_ratio: 0.75

sift:
  threshold: 0.35
  n_features: 0              # 0 表示不限制
  matcher_type: flann
  min_match_count: 8
  ransac_reproj_threshold: 5.0
  knn_ratio: 0.75

lightglue:
  threshold: 0.3
  device: auto               # auto / cpu / cuda
  extractor: superpoint      # superpoint / disk / aliked
  max_keypoints: 1024
  min_match_count: 6
